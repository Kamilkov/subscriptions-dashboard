name: UsageBar
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
options:
  bundleIdPrefix: com.kamilkovac
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Manual
    # Developer ID: app-group entitlements work without provisioning profiles
    # on macOS, and builds are already notarization-ready.
    CODE_SIGN_IDENTITY: "Developer ID Application"
    DEVELOPMENT_TEAM: JXGJ4K9KR9
    GENERATE_INFOPLIST_FILE: YES
targets:
  UsageBar:
    type: application
    platform: macOS
    sources: [UsageBar]
    dependencies:
      - target: UsageBarWidget
      - package: Sparkle
    info:
      path: UsageBar/Info.plist
      properties:
        # Sparkle: feed on GitHub Releases; EdDSA public key pairs with the
        # private key in the login Keychain (generated by Sparkle's generate_keys).
        SUFeedURL: "https://github.com/Kamilkov/subscriptions-dashboard/releases/latest/download/appcast.xml"
        SUPublicEDKey: "antWOJdJaI860Q4DofY+u+mp9bOMSrqeStfx2jROeaA="
        SUEnableAutomaticChecks: true
    entitlements:
      path: UsageBar/UsageBar.entitlements
      properties:
        com.apple.security.application-groups: [JXGJ4K9KR9.group.com.kamilkovac.usagebar]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kamilkovac.usagebar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: UsageBar
        INFOPLIST_KEY_NSHumanReadableCopyright: "© Kamil Kovac"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  UsageBarWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: UsageBarWidget
      - path: UsageBar/Core.swift
      - path: UsageBar/Shared.swift
    entitlements:
      path: UsageBarWidget/UsageBarWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true      # extensions must be sandboxed
        com.apple.security.application-groups: [JXGJ4K9KR9.group.com.kamilkovac.usagebar]
    info:
      path: UsageBarWidget/Info.plist
      properties:
        CFBundleDisplayName: UsageBar
        # xcodegen defaults these to 1.0/1, shipping a widget whose version
        # never matches the app; resolve from the same build settings instead.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kamilkovac.usagebar.widget
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  UsageBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: UsageBarTests
      - path: ../fixtures
        buildPhase: resources
    dependencies:
      - target: UsageBar
